<title>Fraud Ring Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a war-room console. Controls and the live clock on top, the running score,
     then attacker crews | battlefield map | live feed, and what the crews have taken. */
  :root {
    color-scheme: dark;
    --bg: #0a0e1a;
    --grid: rgba(120, 150, 210, 0.05);
    --surface: #111726;
    --surface-2: #161d30;
    --line: #24304b;
    --line-soft: #1b2337;
    --ink: #d7deee;
    --ink-dim: #8492b0;
    --ink-faint: #5b6884;
    --accent: #4f8cff;
    --on-accent: #ffffff;
    --danger: #ff5468;
    --danger-dim: rgba(255, 84, 104, 0.14);
    --danger-line: rgba(255, 84, 104, 0.45);
    --breach-fill: #24151f;
    --safe: #26d18a;
    --safe-dim: rgba(38, 209, 138, 0.13);
    --safe-line: rgba(38, 209, 138, 0.45);
    --on-safe: #05271a;
    --warn: #f5b544;
    --warn-dim: rgba(245, 181, 68, 0.13);
    --telco: #a78bfa;
    --telco-dim: rgba(167, 139, 250, 0.07);
    --telco-line: rgba(167, 139, 250, 0.35);
    --bank: #4f8cff;
    --bank-dim: rgba(79, 140, 255, 0.06);
    --bank-line: rgba(79, 140, 255, 0.32);
    --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.9);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 78% -10%, rgba(15, 98, 254, 0.10), transparent 60%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 34px,
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1440px; margin: 0 auto; padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .ic { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- header ---------- */
  header.top {
    display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; justify-content: space-between;
    border-bottom: 1px solid var(--line); padding-bottom: 18px;
  }
  .titles { min-width: 0; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint); margin: 0; }
  .brandline { display: flex; align-items: center; gap: 11px; margin: 6px 0 4px; }
  h1 { font-size: 25px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .live { width: 11px; height: 11px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  body.running .live { background: var(--danger); animation: pulse 1.2s infinite; }
  body.running[data-mode="on"] .live { background: var(--safe); animation-name: pulse-safe; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 var(--danger-line); } to { box-shadow: 0 0 0 10px transparent; } }
  @keyframes pulse-safe { from { box-shadow: 0 0 0 0 var(--safe-line); } to { box-shadow: 0 0 0 10px transparent; } }
  .clock {
    font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; background: var(--surface-2);
  }
  .sub { color: var(--ink-dim); font-size: 13.5px; margin: 0; max-width: 72ch; line-height: 1.5; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 4px; gap: 3px; }
  .seg button {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500;
    border: 0; background: transparent; color: var(--ink-dim); padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: .18s;
  }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
  .mode button[aria-pressed="true"][data-mode="off"] { background: var(--danger); color: var(--on-accent); }
  .mode button[aria-pressed="true"][data-mode="on"] { background: var(--safe); color: var(--on-safe); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; font-family: var(--sans); font-weight: 600; font-size: 13.5px;
    border-radius: 10px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 8px 20px -10px var(--accent); }
  .btn.kill { border-color: var(--danger-line); color: var(--danger); background: transparent; }
  .btn.kill.shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
  .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- score ---------- */
  .score { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 3fr); gap: 14px; margin-top: 18px; }
  .grp { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 7px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--line-soft); border-radius: 11px; padding: 11px 13px; background: var(--surface); min-width: 0; }
  .tile .k { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }
  .tile .k .ic { width: 13px; height: 13px; }
  .tile .v { font-size: 24px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .gains .tile.hot { border-color: var(--danger-line); }
  .gains .tile.hot .v { color: var(--danger); }
  .defense .tile.hot { border-color: var(--safe-line); }
  .defense .tile.hot .v { color: var(--safe); }

  .verdict {
    margin-top: 14px; border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; align-items: center;
    font-size: 14px; font-weight: 500; line-height: 1.45; border: 1px solid var(--line);
  }
  .verdict .ic { width: 18px; height: 18px; }
  .verdict.bad { background: var(--danger-dim); border-color: var(--danger-line); color: var(--danger); }
  .verdict.good { background: var(--safe-dim); border-color: var(--safe-line); color: var(--safe); }
  .verdict.mixed { background: var(--warn-dim); border-color: var(--warn); color: var(--warn); }

  /* ---------- panels ---------- */
  .main { display: grid; grid-template-columns: minmax(250px, 290px) minmax(0, 1fr) minmax(290px, 350px); gap: 14px; margin-top: 14px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
  .panel > h2 {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint);
    margin: 0; padding: 14px 16px 11px; border-bottom: 1px solid var(--line-soft); font-weight: 500;
  }
  .panel > h2 .h2t { display: inline-flex; align-items: center; gap: 8px; }
  .panel > h2 .ic { width: 14px; height: 14px; color: var(--ink-dim); }
  .panel > h2 .state { letter-spacing: .06em; text-transform: none; font-size: 11px; color: var(--ink-dim); }
  body[data-mode="on"] .panel > h2 .state { color: var(--safe); }

  /* crews */
  .crew-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .crew { border: 1px solid var(--line-soft); border-radius: 11px; padding: 11px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; transition: border-color .25s; }
  .crew.won { border-color: var(--danger-line); }
  .crew.lost { border-color: var(--safe-line); }
  .crew-head { display: flex; align-items: center; gap: 10px; }
  .crew-av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--danger-dim); color: var(--danger); flex: none; }
  .crew-av .ic { width: 18px; height: 18px; }
  .crew-meta { min-width: 0; flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; }
  .crew-name { font-weight: 600; font-size: 13.5px; }
  .crew-goal { font-size: 11.5px; color: var(--ink-dim); margin: 0; }
  .crew-state {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
    padding: 3px 8px; border-radius: 999px; background: rgba(133, 146, 176, .14); color: var(--ink-dim);
  }
  .crew.won .crew-state { background: var(--danger); color: var(--on-accent); }
  .crew.lost .crew-state { background: var(--safe-dim); color: var(--safe); }
  .crew-how { font-size: 12px; color: var(--ink-dim); line-height: 1.45; margin: 0; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .steps li { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-faint); }
  .steps .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }
  .steps li.won { color: var(--ink); }
  .steps li.won .dot { background: var(--danger); border-color: var(--danger); }
  .steps li.lost { color: var(--ink); }
  .steps li.lost .dot { background: var(--safe); border-color: var(--safe); }
  .steps .res { font-family: var(--mono); font-size: 10.5px; }
  .steps li.won .res { color: var(--danger); }
  .steps li.lost .res { color: var(--safe); }

  /* map */
  .mapscroll { overflow-x: auto; padding: 8px 10px 2px; }
  #map { display: block; width: 100%; min-width: 640px; height: auto; color: var(--ink-dim); font-family: var(--sans); }
  #map .col { font: 500 9.5px var(--mono); letter-spacing: .16em; fill: var(--ink-faint); }
  #map .zone rect { stroke-width: 1.2; }
  #map .zone.telco rect { fill: var(--telco-dim); stroke: var(--telco-line); }
  #map .zone.bank rect { fill: var(--bank-dim); stroke: var(--bank-line); }
  #map .zt { font: 600 11px var(--mono); letter-spacing: .14em; }
  #map .telco .zt { fill: var(--telco); }
  #map .bank .zt { fill: var(--bank); }
  #map .zk { font: 400 10.5px var(--mono); fill: var(--ink-faint); }
  #map .band rect { fill: rgba(133, 146, 176, .04); stroke: var(--line); stroke-dasharray: 5 5; transition: .3s; }
  #map .band text { font: 500 9.5px var(--mono); letter-spacing: .16em; fill: var(--ink-faint); }
  body[data-mode="on"] #map .band rect { fill: var(--safe-dim); stroke: var(--safe-line); stroke-dasharray: none; }
  body[data-mode="on"] #map .band text { fill: var(--safe); }
  #map .node rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; transition: stroke .25s, fill .25s; }
  #map .nt { font: 600 12.5px var(--sans); fill: var(--ink); }
  #map .ns { font: 400 10px var(--mono); fill: var(--ink-faint); }
  #map .mic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #map .agent, #map .sys { color: var(--accent); }
  #map .telco-node { color: var(--telco); }
  #map .crewn { color: var(--danger); }
  #map .crewn rect { fill: var(--danger-dim); stroke: var(--danger-line); }
  #map .crewn.firing rect { stroke: var(--danger); stroke-width: 2; }
  #map .chip rect { fill: var(--surface); stroke-dasharray: 3 3; }
  #map .chip text { font: 400 10px var(--mono); fill: var(--ink-dim); }
  #map .node.compromised rect { stroke: var(--danger); stroke-width: 2; fill: var(--breach-fill); }
  #map .node.compromised { color: var(--danger); }
  #map .node.quarantined rect { stroke: var(--danger); stroke-width: 1.6; stroke-dasharray: 5 4; fill: var(--surface-2); }
  #map .node .qlock { opacity: 0; color: var(--danger); transition: opacity .25s; }
  #map .node.quarantined .qlock { opacity: 1; }
  #map .node.quarantined .ns { fill: var(--danger); }
  #map .sys.breached rect { stroke: var(--danger-line); stroke-width: 1.8; }
  #map .sys.hit rect { stroke: var(--danger); stroke-width: 2.4; fill: var(--breach-fill); }
  #map .sys.hit, #map .sys.breached { color: var(--danger); }
  #map .trail { fill: none; stroke-width: 2.4; stroke-linecap: round; transition: opacity .8s; }
  #map .trail.breach { stroke: var(--danger); }
  #map .trail.attempt { stroke: var(--danger-line); }
  #map .trail.old { opacity: .14; }
  #map .gate { opacity: 0; transition: opacity .3s; }
  body[data-mode="on"] #map .gate { opacity: 1; }
  #map .gate circle { fill: var(--surface); stroke: var(--safe); stroke-width: 1.5; transition: fill .2s; }
  #map .gate .x { stroke: var(--on-safe); stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
  #map .gate .gl { font: 600 9.5px var(--mono); fill: var(--safe); opacity: 0; transition: opacity .2s; }
  #map .gate.stop circle { fill: var(--safe); }
  #map .gate.stop .x, #map .gate.stop .gl { opacity: 1; }
  #map .signal { color: var(--ink-faint); opacity: .35; transition: opacity .3s, color .3s; }
  #map .signal path { stroke: currentColor; stroke-width: 1.6; fill: none; }
  #map .signal text { font: 500 9.5px var(--mono); fill: currentColor; }
  #map .signal.sent { color: var(--accent); opacity: 1; }
  #map .signal.live path { stroke-dasharray: 4 3; animation: flow .6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .mapcap { font-size: 12.5px; color: var(--ink-dim); line-height: 1.55; margin: 0; padding: 6px 16px 14px; }
  .mapcap b { color: var(--ink); font-weight: 600; }

  /* feed */
  .feed-list { list-style: none; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 9px; max-height: 620px; overflow-y: auto; }
  .ev { border: 1px solid var(--line-soft); border-left: 3px solid var(--ink-faint); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); animation: rise .3s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .ev.allowed { border-left-color: var(--danger); }
  .ev.blocked { border-left-color: var(--safe); }
  .ev.signal { border-left-color: var(--accent); }
  .ev.kill { border-left-color: var(--warn); }
  .ev-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .ev-t { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .ev-who { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }
  .ev-who .ic { width: 13px; height: 13px; color: var(--danger); }
  .org { padding: 2px 6px; border-radius: 5px; font-size: 10px; }
  .org.telco { background: rgba(167, 139, 250, .14); color: var(--telco); }
  .org.bank { background: rgba(79, 140, 255, .14); color: var(--bank); }
  .pill { margin-left: auto; padding: 2px 7px; border-radius: 6px; font-weight: 600; letter-spacing: .06em; font-size: 10.5px; }
  .ev.allowed .pill { background: var(--danger-dim); color: var(--danger); }
  .ev.blocked .pill { background: var(--safe-dim); color: var(--safe); }
  .ev.signal .pill { background: rgba(79, 140, 255, .16); color: var(--accent); }
  .ev.kill .pill { background: var(--warn-dim); color: var(--warn); }
  .ev.info .pill { background: rgba(133, 146, 176, .14); color: var(--ink-dim); }
  .ev-act { font-size: 12.5px; line-height: 1.5; margin: 6px 0 0; }
  .ev-out { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--ink-dim); margin: 6px 0 0; line-height: 1.45; }
  .ev-out .ic { width: 13px; height: 13px; margin-top: 2px; }
  .ev.allowed .ev-out .ic { color: var(--danger); }
  .ev.blocked .ev-out .ic { color: var(--safe); }
  .ev-out b { font-family: var(--mono); font-weight: 500; font-size: 11px; color: var(--accent); white-space: nowrap; }
  .ev.allowed .ev-out b { color: var(--ink-faint); }

  /* take */
  .take { margin-top: 14px; }
  .take-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 14px; }
  .loot { border: 1px solid var(--line-soft); border-radius: 11px; padding: 12px 13px; background: var(--surface-2); min-width: 0; }
  .loot.has { border-color: var(--danger-line); }
  .loot .k { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }
  .loot .k .ic { width: 13px; height: 13px; }
  .loot .v { font-size: 21px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .loot.has .v { color: var(--danger); }
  .loot ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .loot li { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); min-width: 0; }
  .loot li span:first-child { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loot li span:last-child { white-space: nowrap; }
  .loot .more, .loot .none { font-size: 11.5px; color: var(--ink-faint); margin: 7px 0 0; }

  .footnote { margin: 22px 0 0; font-size: 12px; color: var(--ink-faint); line-height: 1.6; border-top: 1px solid var(--line-soft); padding-top: 14px; max-width: 150ch; }
  .footnote b { color: var(--ink-dim); font-weight: 600; }
  .footnote .ic { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; color: var(--ink-dim); }

  @media (max-width: 1240px) {
    .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .mapcard { grid-column: 1 / -1; order: -1; }
  }
  @media (max-width: 1100px) { .score { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 900px) { .take-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 520px) { .take-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (prefers-reduced-motion: reduce) {
    .ev, body.running .live, #map .signal.live path, .btn.kill.shake { animation: none; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="titles">
      <p class="eyebrow" data-t="eyebrow"></p>
      <div class="brandline"><span class="live" aria-hidden="true"></span><h1 data-t="title"></h1><span class="clock" id="clock">00:00</span></div>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="controls">
      <div class="seg mode" role="group" data-ta="ariaControls">
        <button id="modeOff" data-mode="off" aria-pressed="true"><i data-ic="shieldOff"></i><span data-t="controlsOff"></span></button>
        <button id="modeOn" data-mode="on" aria-pressed="false"><i data-ic="shieldCheck"></i><span data-t="controlsOn"></span></button>
      </div>
      <div class="seg speed" role="group" data-ta="ariaSpeed">
        <button id="speed1" data-speed="1" aria-pressed="true">1×</button>
        <button id="speed2" data-speed="2" aria-pressed="false">2×</button>
        <button id="speed4" data-speed="4" aria-pressed="false">4×</button>
      </div>
      <div class="seg lang" role="group" data-ta="ariaLang">
        <button id="langEn" data-lang="en" aria-pressed="true" lang="en">EN</button>
        <button id="langFr" data-lang="fr" aria-pressed="false" lang="fr">FR</button>
      </div>
      <button class="btn primary" id="runBtn"></button>
      <button class="btn" id="resetBtn"><i data-ic="replay"></i><span data-t="reset"></span></button>
      <button class="btn kill" id="killBtn"><i data-ic="power"></i><span data-t="kill"></span></button>
    </div>
  </header>

  <section class="score" data-ta="ariaScore">
    <div>
      <p class="grp" data-t="grpTake"></p>
      <div class="tiles gains">
        <div class="tile" id="k-money"><div class="k"><i data-ic="banknote"></i><span data-t="kMoney"></span></div><div class="v">$0</div></div>
        <div class="tile" id="k-records"><div class="k"><i data-ic="users"></i><span data-t="kRecords"></span></div><div class="v">0</div></div>
        <div class="tile" id="k-cards"><div class="k"><i data-ic="card"></i><span data-t="kCards"></span></div><div class="v">0</div></div>
        <div class="tile" id="k-phones"><div class="k"><i data-ic="sim"></i><span data-t="kPhones"></span></div><div class="v">0</div></div>
        <div class="tile" id="k-accounts"><div class="k"><i data-ic="key"></i><span data-t="kAccounts"></span></div><div class="v">0</div></div>
      </div>

// French typography: non-breaking spaces before colons, inside guillemets and in numbers.
function frenchSpacing(v) {
  if (typeof v === "string") {
    return v.replace(/ :/g, " :").replace(/« /g, "« ").replace(/ »/g, " »").replace(/(\d) (\d)/g, "$1 $2").replace(/(\d) \$/g, "$1 $");
  }
  if (typeof v === "function") return (...a) => frenchSpacing(v(...a));
  if (Array.isArray(v)) return v.map(frenchSpacing);
  if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, frenchSpacing(x)]));
  return v;
}
I18N.fr = frenchSpacing(I18N.fr);

// Path from a crew, through its gate on the control plane, to the agent and system it hits.
function segments(ev) {
  const py = CREW[ev.crew].y, g = ev.gate;
  if (ev.out) {
    return { approach: `M300,${g} L239,${g}`, rest: `M217,${g} C199,${g} 200,${py} 182,${py}` };
  }
  const approach = `M182,${py} C200,${py} 199,${g} 217,${g}`;
  const s = SYSTEMS[ev.system], sy = s.y + s.h / 2;
  const inside = AGENTS[ev.agent];
  const from = inside ? 300 + AGENT_W : 239;
  const rest = (inside ? `M239,${g} L300,${g} M${from},${g}` : `M239,${g}`) + ` C${from + 60},${g} ${560},${sy} 620,${sy}`;
  return { approach, rest };
}

function drawTrail(d, cls, ms, epoch) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d);
  p.setAttribute("class", "trail " + cls);
  const layer = $("#paths");
  layer.appendChild(p);
  while (layer.childNodes.length > 40) layer.removeChild(layer.firstChild);
  if (reduce || ms <= 0) return Promise.resolve(p);
  const len = p.getTotalLength();
  p.style.strokeDasharray = `${len} ${len}`;
  p.style.strokeDashoffset = len;
  p.getBoundingClientRect();
  p.style.transition = `stroke-dashoffset ${ms}ms ease-out, opacity .8s`;
  p.style.strokeDashoffset = 0;
  return new Promise((resolve) => setTimeout(() => {
    if (epoch === S.epoch) p.style.strokeDasharray = "none";
    resolve(p);
  }, ms));
}

function later(ms, epoch, fn) { setTimeout(() => { if (epoch === S.epoch) fn(); }, ms); }

async function animate(ev, res) {
  const epoch = S.epoch;
  const pace = (ms) => (reduce ? 0 : Math.max(120, ms / S.speed));
  const crewNode = $(`#c-${ev.crew}`);
  crewNode.classList.add("firing");
  later(1400 / S.speed, epoch, () => crewNode.classList.remove("firing"));
  const { approach, rest } = segments(ev);
  const first = await drawTrail(approach, res.blocked ? "attempt" : "breach", pace(480), epoch);
  if (epoch !== S.epoch) return;
  later(2600 / S.speed, epoch, () => first.classList.add("old"));
  if (res.blocked) {
    const gate = $(`#g-${ev.gate}`);
    gate.querySelector(".gl").textContent = L.checks[res.check];
    gate.classList.add("stop");
    later(2600 / S.speed, epoch, () => gate.classList.remove("stop"));
    return;
  }
  const second = await drawTrail(rest, "breach", pace(680), epoch);
  if (epoch !== S.epoch) return;
  later(2600 / S.speed, epoch, () => second.classList.add("old"));
  const target = ev.out ? crewNode : $(`#s-${ev.system}`);
  target.classList.add(ev.out ? "firing" : "hit");
  later(1300 / S.speed, epoch, () => target.classList.remove(ev.out ? "firing" : "hit"));
  if (!ev.out) { S.breached.add(ev.system); syncNodes(); }
}

function pulseSignal() {
  const sig = $("#signal"), epoch = S.epoch;
  sig.classList.add("sent", "live");
  later(3000 / S.speed, epoch, () => sig.classList.remove("live"));
}

function syncNodes() {
  for (const k of Object.keys(AGENTS)) {
    const n = $(`#n-${k}`);
    n.classList.toggle("quarantined", S.quar.has(k));
    n.classList.toggle("compromised", S.comp.has(k) && !S.quar.has(k));
  }
  for (const k of Object.keys(SYSTEMS)) $(`#s-${k}`).classList.toggle("breached", S.breached.has(k));
}

function renderCrews() {
  $("#crews").innerHTML = CREWS.map((c) => {
    const w = L.crews[c.id];
    const done = S.steps[c.id];
    const fired = done.filter(Boolean).length;
    const won = done.filter((r) => r === "won").length;
    let state = L.state.waiting, cls = "";
    if (fired === c.steps) {
      state = won === fired ? L.state.succeeded : won === 0 ? L.state.stopped : L.state.partly;
      cls = won > 0 ? "won" : "lost";
    } else if (fired > 0) {
      const through = S.last[c.id] === "won";
      state = through ? L.state.through : L.state.blocked;
      cls = through ? "won" : "lost";
    }
    const steps = w.steps.map((label, i) => {
      const r = done[i];
      return `<li class="${r || ""}"><span class="dot"></span>${label}${r ? ` <span class="res">· ${L.res[r]}</span>` : ""}</li>`;
    }).join("");
    return `<div class="crew ${cls}">
      <div class="crew-head"><span class="crew-av">${ic(c.icon)}</span>
        <div class="crew-meta"><span class="crew-name">${w.name}</span><span class="crew-state">${state}</span></div></div>
      <p class="crew-goal">${w.goal}</p>
      <p class="crew-how">${w.how}</p>
      <ol class="steps">${steps}</ol></div>`;
  }).join("");
}

function tween(el, to, fmt) {
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  if (reduce || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1 && Number(el.dataset.v) === to) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function renderScore() {
  const tiles = [
    ["k-money", S.loot.money, money], ["k-records", S.loot.records, num], ["k-cards", S.loot.cards, num],
    ["k-phones", S.loot.phones, num], ["k-accounts", S.loot.accounts, num],
    ["k-blocked", S.blocked, num], ["k-quar", S.quar.size, num], ["k-signals", S.signals, num],
  ];
  for (const [id, v, fmt] of tiles) {
    const tile = document.getElementById(id);
    tile.classList.toggle("hot", v > 0);
    tween(tile.querySelector(".v"), v, fmt);
  }
}

function renderTake() {
  const cols = [
    ["records", "users", num(S.loot.records), S.loot.records],
    ["cards", "card", num(S.loot.cards), S.loot.cards],
    ["phones", "sim", num(S.loot.phones), S.loot.phones],
    ["money", "banknote", money(S.loot.money), S.loot.money],
  ];
  $("#take").innerHTML = cols.map(([key, icon, shown, count]) => {
    const label = L.take[key];
    if (!count) {
      return `<div class="loot"><div class="k">${ic(icon)}${label}</div><div class="v">${shown}</div><p class="none">${S.finished ? L.take.noneEnd : L.take.none}</p></div>`;
    }
    const rows = L.samples[key].slice(0, Math.min(3, count));
    const more = key === "money" ? L.take.mules(S.loot.money > 480000)
      : count > rows.length ? L.take.more(num(count - rows.length)) : "";
    return `<div class="loot has"><div class="k">${ic(icon)}${label}</div><div class="v">${shown}</div>
      <ul>${rows.map(([a, b]) => `<li><span>${a}</span><span>${b}</span></li>`).join("")}</ul>
      ${more ? `<p class="more">${more}</p>` : ""}</div>`;
  }).join("");
}

function feed(e) {
  const crew = e.crew ? CREW[e.crew] : null;
  const who = crew ? `<span class="ev-who">${ic(crew.icon)}${L.crews[crew.id].name}</span>` : "";
  const org = e.org ? `<span class="org ${e.org}">${ORGS[e.org]}</span>` : "";
  const icon = e.kind === "allowed" ? "alert" : e.kind === "blocked" ? "shieldCheck" : e.kind === "signal" ? "signal" : e.kind === "kill" ? "power" : "info";
  const li = document.createElement("li");
  li.className = `ev ${e.kind}`;
  li.innerHTML = `<div class="ev-top"><span class="ev-t">${mmss(S.t)}</span>${who}${org}<span class="pill">${L.pill[e.kind]}</span></div>
    ${e.act ? `<p class="ev-act">${e.act}</p>` : ""}
    ${e.out ? `<p class="ev-out">${ic(icon)}<span>${e.out}${e.check ? ` <b>${e.check}</b>` : ""}</span></p>` : ""}`;
  const list = $("#feed");
  list.prepend(li);
  while (list.children.length > 60) list.lastElementChild.remove();
}

function renderMode() {
  const on = S.mode === "on";
  document.body.dataset.mode = S.mode;
  $("#modeOff").setAttribute("aria-pressed", String(!on));
  $("#modeOn").setAttribute("aria-pressed", String(on));
  $("#bandLabel").textContent = on ? L.band.on : L.band.off;
  $("#planeState").textContent = on ? L.plane.on : L.plane.off;
  $("#mapcap").innerHTML = on ? L.mapcap.on : L.mapcap.off;
}

function renderRun() {
  const b = $("#runBtn");
  if (S.running) b.innerHTML = ic("pause") + L.run.pause;
  else if (S.finished) b.innerHTML = ic("replay") + L.run.replay;
  else if (S.t > 0) b.innerHTML = ic("play") + L.run.resume;
  else b.innerHTML = ic("play") + L.run.start;
  document.body.classList.toggle("running", S.running);
  $("#clock").textContent = mmss(S.t);
}

// ---------------------------------------------------------------------------
// Engine
// ---------------------------------------------------------------------------
function fire(ev) {
  const on = S.mode === "on";
  const words = L.moves[ev.id];
  const say = (v) => (typeof v === "function" ? v(S) : v);
  const act = say(words.act);
  let res;
  if (on) {
    if (ev.agent && S.quar.has(ev.agent)) {
      res = { check: "response", text: L.refused(L.agentRef[ev.agent], S.killed) };
    } else {
      const rule = typeof ev.on === "function" ? ev.on(S) : ev.on;
      res = { ...rule, text: say(words.on) };
      if (rule.quarantine) S.quar.add(rule.quarantine);
    }
    res.blocked = true;
    S.blocked += 1;
    if (res.signal) S.signals += 1;
  } else {
    res = { text: say(words.off), blocked: false };
    for (const [k, v] of Object.entries(ev.loot)) S.loot[k] += v;
    if (AGENTS[ev.agent]) S.comp.add(ev.agent);
    if (ev.via) S.comp.add(ev.via);
  }
  S.steps[ev.crew][ev.step] = res.blocked ? "lost" : "won";
  S.last[ev.crew] = res.blocked ? "lost" : "won";
  animate(ev, res);
  feed({ kind: res.blocked ? "blocked" : "allowed", crew: ev.crew, org: ev.org, act, out: res.text,
         check: res.blocked ? L.checks[res.check] : L.noCheck });
  if (res.signal) {
    pulseSignal();
    feed({ kind: "signal", org: "telco", act: L.signal.act, out: L.signal.out, check: L.checks.shared });
  }
  syncNodes(); renderCrews(); renderScore(); renderTake();
}

let lastFrame = 0;
function loop(now) {
  if (!S.running) return;
  const dt = Math.min(0.25, (now - lastFrame) / 1000);
  lastFrame = now;
  S.t += dt * S.speed;
  while (S.next < SCRIPT.length && SCRIPT[S.next].t <= S.t) fire(SCRIPT[S.next++]);
  $("#clock").textContent = mmss(S.t);
  if (S.next >= SCRIPT.length && S.t >= END_T) { finish(); return; }
  requestAnimationFrame(loop);
}

function announceStart() { feed({ kind: "info", act: L.started(S.mode === "on") }); }

function start() {
  if (S.t === 0) announceStart();
  S.running = true;
  lastFrame = performance.now();
  renderRun();
  requestAnimationFrame(loop);
}

function pause() { S.running = false; renderRun(); }

function finish() {
  S.running = false;
  S.finished = true;
  S.t = END_T;
  renderRun(); renderTake();
  const gains = [
    S.loot.money && money(S.loot.money),
    S.loot.records && L.gains.records(num(S.loot.records)),
    S.loot.cards && L.gains.cards(num(S.loot.cards)),
    S.loot.phones && L.gains.phones(num(S.loot.phones)),
    S.loot.accounts && L.gains.accounts(num(S.loot.accounts)),
  ].filter(Boolean);
  const took = gains.length > 1 ? `${gains.slice(0, -1).join(", ")}${L.gains.and}${gains[gains.length - 1]}` : gains[0];
  const v = $("#verdict");
  if (!took) {
    v.className = "verdict good";
    v.innerHTML = `${ic("shieldCheck")}<span>${L.verdict.good(num(S.blocked), num(S.quar.size), num(S.signals))}</span>`;
  } else if (S.blocked === 0) {
    v.className = "verdict bad";
    v.innerHTML = `${ic("alert")}<span>${L.verdict.bad(mmss(END_T), took)}</span>`;
  } else {
    v.className = "verdict mixed";
    v.innerHTML = `${ic("alert")}<span>${L.verdict.mixed(took, num(S.blocked))}</span>`;
  }
  v.hidden = false;
  feed({ kind: "info", act: L.ended(mmss(END_T)) });
}

function reset() {
  S.epoch += 1;
  freshState();
  $("#paths").innerHTML = "";
  document.querySelectorAll("#map .gate").forEach((g) => g.classList.remove("stop"));
  document.querySelectorAll("#map .crewn, #map .sys").forEach((n) => n.classList.remove("firing", "hit"));
  $("#signal").classList.remove("sent", "live");
  $("#verdict").hidden = true;
  $("#feed").innerHTML = "";
  feed({ kind: "info", act: L.intro });
  syncNodes(); renderCrews(); renderScore(); renderTake(); renderRun();
}

function setMode(mode) {
  if (mode === S.mode) return;
  S.mode = mode;
  renderMode();
  if (S.t > 0 && !S.finished) {
    S.toggles += 1;
    feed({ kind: "info", act: L.toggled(mode === "on", mmss(S.t)) });
  }
}

function killSwitch() {
  const btn = $("#killBtn");
  if (S.mode === "off") {
    btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
    feed({ kind: "kill", act: L.kill.pressed, out: L.kill.noPlane });
    return;
  }
  const before = S.quar.size;
  ["csvc", "cards", "plugin", "care", "pay"].forEach((k) => S.quar.add(k));
  S.killed = true;
  const added = S.quar.size - before;
  feed({ kind: "kill", act: L.kill.pressed, out: added ? L.kill.added(added) : L.kill.already });
  syncNodes(); renderScore();
}

// Switches every word on the page. The simulation starts over in the new language.
function setLang(next) {
  lang = next;
  L = I18N[next];
  document.documentElement.lang = next === "fr" ? "fr-CA" : "en";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = L.ui[el.dataset.t]; });
  document.querySelectorAll("[data-th]").forEach((el) => { el.innerHTML = L.ui[el.dataset.th]; });
  document.querySelectorAll("[data-ta]").forEach((el) => el.setAttribute("aria-label", L.ui[el.dataset.ta]));
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === next)));
  buildMap();
  renderMode();
  reset();
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
document.querySelectorAll(".mode button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.querySelectorAll(".speed button").forEach((b) => b.addEventListener("click", () => {
  S.speed = Number(b.dataset.speed);
  document.querySelectorAll(".speed button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
}));
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  setLang(b.dataset.lang);
  location.hash = b.dataset.lang;
}));
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if ((h === "en" || h === "fr") && h !== lang) setLang(h);
});
$("#runBtn").addEventListener("click", () => {
  if (S.finished) { reset(); start(); }
  else if (S.running) pause();
  else start();
});
$("#resetBtn").addEventListener("click", reset);
$("#killBtn").addEventListener("click", killSwitch);

setLang(location.hash.slice(1) === "fr" ? "fr" : "en");
</script>
