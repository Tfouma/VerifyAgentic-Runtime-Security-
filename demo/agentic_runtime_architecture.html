(function frenchSpaces(o) {
  for (const k of Object.keys(o)) {
    if (typeof o[k] === 'string') o[k] = o[k].replace(/ ([:;?!])(?=[\s<]|$)/g, ' $1');
    else if (o[k] && typeof o[k] === 'object') frenchSpaces(o[k]);
  }
})(FR);
const L = (kind, id, en) => (LANG === 'fr' && FR[kind] && FR[kind][id] != null ? FR[kind][id] : en);

/* ------------------------------------------------------------------ drawing */
const wrap = document.getElementById('wrap');
const panel = document.getElementById('panel');
const box = (o) => `left:${px(o.x)}px;top:${px(o.y)}px;width:${px(o.w)}px;height:${px(o.h)}px`;

function draw() {
  const BAND_EN = `<b>IBM Verify Identity Protection — agentic identity observability</b><br><b>Discovers</b> every agent and its identities (registered or shadow),
    with owner, delegations and credentials &nbsp;·&nbsp; <b>Maps</b> who each agent acts for and what it can reach: employee → agent → token → Vault login → data
    &nbsp;·&nbsp; <b>Detects</b> unusual delegation, privilege drift, agents using static secrets or service accounts outside Vault, MFA gaps on the employees
    agents act for &nbsp;·&nbsp; <b>Responds</b> via SIEM / SOAR playbooks that trigger the kill switches`;
  let h = `<div class="el band" id="band" style="${box({ x: 0.10, y: 0.08, w: 13.54, h: 0.83 })}${LANG === 'fr' ? ';font-size:11.8px;line-height:1.3;padding-top:7px' : ''}">${LANG === 'fr' ? FR.band : BAND_EN}</div>`;
  ZONES.forEach((z) => {
    h += `<div class="el zone" id="${z.id}" style="${box(z)};border-color:${z.line};background:${z.fill}"><div class="zt ${z.br ? 'br' : ''}">${L('zones', z.id, z.title)}</div></div>`;
  });
  PEOPLE.forEach((p) => {
    const r = (a) => `left:${px(a[0])}px;top:${px(a[1])}px;width:${px(a[2])}px;height:${px(a[3])}px`;
    h += `<div class="el person" id="${p.id}" style="left:0;top:0;width:0;height:0"><div class="head" style="${r(p.head)}"></div>
      <div class="body" style="${r(p.body)}"></div><div class="pl" style="${r(p.label)}">${L('people', p.id, p.html)}</div></div>`;
  });
  BOXES.forEach((b) => {
    h += `<div class="el box ${b.dash ? 'dash' : ''} c-${b.c}" id="${b.id}" style="${box(b)};border-color:${b.line};${b.fill ? `background:${b.fill};` : ''}${b.small ? 'font-size:11.1px;' : ''}${b.tight || (LANG === 'fr' && FR.tight.includes(b.id)) ? 'font-size:11.6px;padding:4px 7px;letter-spacing:-0.1px;' : ''}">${L('boxes', b.id, b.html)}</div>`;
  });
  KILLS.forEach((k) => {
    const tight = k.tight ? (LANG === 'fr' ? ';font-size:9.4px;line-height:1.1;padding:0 3px' : ';font-size:10.2px;white-space:nowrap;padding:0 3px') : '';
    h += `<div class="el ks" id="${k.id}" style="${box(k)}${tight}">${L('kills', k.id, k.text)}</div>`;
  });
  // The payments database, drawn as a cylinder.
  const W = px(2.55), H = px(0.65), ry = 9;
  h += `<div class="el db" id="db" style="${box({ x: 6.56, y: 8.8, w: 2.55, h: 0.65 })}"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <path d="M0 ${ry} V${H - ry} A${W / 2} ${ry} 0 0 0 ${W} ${H - ry} V${ry}" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
    <ellipse cx="${W / 2}" cy="${ry}" rx="${W / 2}" ry="${ry}" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/></svg>
    <div class="dbt">${LANG === 'fr' ? FR.db : '<b>Payments database</b><br>accounts · payment_requests'}</div></div>`;
  // Arrows and their labels.
  const colors = [...new Set(ARROWS.map((a) => a.color))];
  let svg = `<svg class="arrows" viewBox="0 0 1401 990"><defs>${colors.map((c) =>
    `<marker id="m${c.slice(1)}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  ARROWS.forEach((a) => {
    const d = 'M' + a.pts.map(([x, y]) => `${px(x)} ${px(y)}`).join(' L');
    svg += `<g class="el arr" id="${a.id}"><path d="${d}" stroke="${a.color}" stroke-width="${a.dash ? 1.6 : 2}" ${a.dash ? 'stroke-dasharray="5 4"' : ''}
      ${a.head === false ? '' : `marker-end="url(#m${a.color.slice(1)})"`}/><path class="pulse" d="${d}" stroke="${a.color}" pathLength="100"/></g>`;
  });
  svg += '</svg>';
  h += svg;
  LABELS.forEach((l) => { h += `<div class="el lbl" id="${l.id}" style="left:${px(l.x)}px;top:${px(l.y)}px${l.wrap ? ';line-height:13px;padding:1px 3px' : ''}">${L('labels', l.id, l.text)}</div>`; });
  wrap.innerHTML = h;
}

/* ------------------------------------------------------------------ the camera */
const STAGE = { w: 1920, h: 1080 };
let filmMode = false;
// With a panel, the diagram uses the left of the stage; without, all of it. The
// bottom stays clear for the film's captions.
const AREA = { panel: { x: 24, y: 24, w: 1210, h: 876 }, full: { x: 24, y: 18, w: 1872, h: 884 } };
function frameTo([x, y, w, h], area, instant) {
  const s = Math.min(2.3, (area.w * 0.96) / (w * IN), (area.h * 0.96) / (h * IN));
  const tx = area.x + area.w / 2 - s * (x + w / 2) * IN;
  const ty = area.y + area.h / 2 - s * (y + h / 2) * IN;
  if (instant) wrap.classList.add('instant');
  wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  if (instant) { void wrap.offsetWidth; wrap.classList.remove('instant'); }
}

/* ------------------------------------------------------------------ steps */
let cur = 0;
function renderPanel(p) {
  if (!p) { panel.classList.remove('on'); return; }
  const fill = () => {
    panel.style.setProperty('--c', p.c);
    panel.innerHTML = `<span class="chip" style="--c:${p.c}">${p.chip}</span>${p.rec ? `<span class="chip rec">${p.rec}</span>` : ''}
      <h2>${p.title}</h2>${p.facts ? `<ul class="facts">${p.facts.map((f) => `<li>${f}</li>`).join('')}</ul>` : ''}${p.extra || ''}`;
    panel.classList.add('on');
  };
  if (panel.classList.contains('on')) { panel.classList.remove('on'); setTimeout(fill, 350); } else fill();
}
function go(i, instant = false) {
  cur = Math.max(0, Math.min(STEPS.length - 1, typeof i === 'string' ? STEPS.findIndex((s) => s.id === i) : i));
  const st = STEPS[cur];
  const hot = new Set(st.hot);
  const lit = st.lit === 'all' ? null : new Set(st.lit);
  wrap.querySelectorAll('.el').forEach((el) => {
    const on = !lit || lit.has(el.id) || hot.has(el.id);
    el.classList.toggle('dim', !on);
    el.classList.toggle('hot', hot.has(el.id));
    const pulse = el.querySelector && el.querySelector('.pulse');
    if (pulse) pulse.classList.toggle('on', hot.has(el.id));
  });
  frameTo(st.frame, st.panel ? AREA.panel : AREA.full, instant);
  const p = st.panel && (LANG === 'fr' ? { ...st.panel, ...FR.panels[st.id] } : st.panel);
  renderPanel(p);
  document.getElementById('pos').textContent = `${cur + 1} / ${STEPS.length} · ${p ? p.chip : (LANG === 'fr' ? FR.nav.overview : 'Overview')}`;
}

// Fits the 1920x1080 stage into the window (the film runs at exactly that size).
function fit() {
  const f = document.getElementById('fit');
  if (filmMode) { f.style.transform = 'none'; return; }
  const k = Math.min(innerWidth / STAGE.w, innerHeight / STAGE.h);
  f.style.transform = `translate(${(innerWidth - STAGE.w * k) / 2}px, ${(innerHeight - STAGE.h * k) / 2}px) scale(${k})`;
}

function setNav() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('.nav [data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  document.getElementById('prev').textContent = LANG === 'fr' ? FR.nav.back : '‹ Back';
  document.getElementById('next').textContent = LANG === 'fr' ? FR.nav.next : 'Next ›';
}
function setLang(l) {
  LANG = l;
  history.replaceState(null, '', l === 'fr' ? '#fr' : '#');
  draw();
  setNav();
  go(cur, true);
}

draw();
setNav();
fit();
go(0, true);
document.querySelectorAll('.nav [data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
addEventListener('resize', fit);
document.getElementById('next').addEventListener('click', () => go(cur + 1));
document.getElementById('prev').addEventListener('click', () => go(cur - 1));
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
});

// The film's handle on the page.
window.arch = {
  film() { filmMode = true; document.body.classList.add('film'); fit(); },
  go,
  steps: () => STEPS.map((s) => s.id),
};
</script>
</body>
</html>
