<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity Attacks Explained</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* A presenter's explainer in eleven scenes, drawn on a fixed 1920x1080 canvas that
     scales to the window. Each scene reveals itself in steps (Next / Back, or the
     arrow keys). The demo film drives the same page through window.explain. */
  :root {
    color-scheme: dark;
    --bg: #0a0e1a;
    --grid: rgba(120, 150, 210, 0.05);
    --surface: #111726;
    --surface-2: #161d30;
    --line: #24304b;
    --line-soft: #1b2337;
    --lifeline: #2b3858;
    --ink: #d7deee;
    --ink-hi: #eef2fb;
    --ink-dim: #8f9cb9;
    --ink-faint: #637091;
    --accent: #4f8cff;
    --accent-dim: rgba(79, 140, 255, 0.14);
    --accent-line: rgba(79, 140, 255, 0.5);
    --danger: #ff5468;
    --danger-dim: rgba(255, 84, 104, 0.13);
    --danger-line: rgba(255, 84, 104, 0.5);
    --breach-fill: #24151f;
    --safe: #26d18a;
    --safe-dim: rgba(38, 209, 138, 0.12);
    --safe-line: rgba(38, 209, 138, 0.5);
    --warn: #f5b544;
    --warn-dim: rgba(245, 181, 68, 0.12);
    --warn-line: rgba(245, 181, 68, 0.5);
    --violet: #a78bfa;
    --violet-dim: rgba(167, 139, 250, 0.12);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .ic { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* The canvas. .fit scales it to the window; .wrap is what the film's camera moves. */
  .fit { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .wrap { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(1200px 640px at 80% -12%, rgba(15, 98, 254, 0.11), transparent 60%),
                linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 36px, var(--bg); }

  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s linear .9s; }
  .scene.active { opacity: 1; visibility: visible; transition: opacity .9s ease; }
  .instant, .instant * { transition: none !important; }

  /* Step reveals */
  [data-s] { opacity: 0; transform: translateY(12px); transition: opacity .7s ease, transform .7s ease; }
  [data-s].on { opacity: 1; transform: none; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px var(--glow, rgba(255, 84, 104, .35)); } }
  .hl { animation: glow 1.5s ease-in-out infinite; }

  /* Scene header */
  .hd { position: absolute; left: 80px; right: 80px; top: 54px; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .ey { font-family: var(--mono); font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }
  .ti { font-size: 46px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink-hi); margin: 0; line-height: 1.12; max-width: 1180px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; max-width: 640px; }
  .chip { font-family: var(--mono); font-size: 16px; color: var(--ink-dim); border: 1px solid var(--line); background: var(--surface-2);
          border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  .note { position: absolute; right: 80px; top: 70px; max-width: 560px; text-align: right; font-family: var(--mono); font-size: 15px; line-height: 1.5; color: var(--ink-faint); letter-spacing: .03em; }

  /* ---------- Three kinds of identity ---------- */
  .ids { position: absolute; left: 80px; right: 80px; top: 230px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px; }
  .idc { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 38px 38px 40px; min-height: 520px; }
  .idc .big { width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center; background: var(--accent-dim); color: #8db4ff; margin-bottom: 26px; }
  .idc .big .ic { width: 44px; height: 44px; }
  .idc.m .big { background: var(--violet-dim); color: var(--violet); }
  .idc.a .big { background: var(--warn-dim); color: var(--warn); }
  .idc h3 { font-size: 36px; margin: 0 0 14px; color: var(--ink-hi); }
  .idc p { font-size: 24px; line-height: 1.5; color: var(--ink-dim); margin: 0 0 26px; }
  .idc .how { font-family: var(--mono); font-size: 16px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
  .idc ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .idc li { font-size: 21px; color: var(--ink); display: flex; gap: 12px; align-items: center; }
  .idc li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .idc.m li::before { background: var(--violet); }
  .idc.a li::before { background: var(--warn); }

  /* ---------- Sequence diagrams ---------- */
  .seq { position: absolute; top: 196px; height: 700px; }
  .lane { position: absolute; top: 0; min-height: 96px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line);
          border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  .lane .li { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--accent-dim); color: #8db4ff; }
  .lane .li .ic { width: 26px; height: 26px; }
  .lane.violet .li { background: var(--violet-dim); color: var(--violet); }
  .lane.warn .li { background: var(--warn-dim); color: var(--warn); }
  .lane.safe .li { background: var(--safe-dim); color: var(--safe); }
  .lane b { display: block; font-size: 21px; font-weight: 600; color: var(--ink-hi); line-height: 1.2; }
  .lane small { display: block; font-size: 15.5px; color: var(--ink-dim); line-height: 1.3; margin-top: 3px; }
  .seq.tight .lane b { font-size: 18.5px; }
  .seq.tight .lane small { font-size: 14px; }
  .seq.tight .lane .li { width: 40px; height: 40px; }
  .seq.tight .lane { padding: 10px 12px; gap: 10px; }
  .life { position: absolute; top: 96px; bottom: 0; width: 0; border-left: 2px dashed var(--lifeline); transform: translateX(-1px); }
  .msg { position: absolute; height: 34px; transform: none !important; }
  .msg .ln { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); border-radius: 2px;
             transform: scaleX(0); transition: transform .9s cubic-bezier(.4, 0, .2, 1); }
  .msg.rtl .ln { transform-origin: 100% 50%; }
  .msg.ltr .ln { transform-origin: 0 50%; }
  .msg.on .ln { transform: scaleX(1); }
  .msg .ln::after { content: ""; position: absolute; top: -6px; border: 7.5px solid transparent; }
  .msg.ltr .ln::after { right: -3px; border-left: 12px solid var(--c, var(--accent)); border-right: 0; }
  .msg.rtl .ln::after { left: -3px; border-right: 12px solid var(--c, var(--accent)); border-left: 0; }
  .msg.both .ln::before { content: ""; position: absolute; top: -6px; left: -3px; border: 7.5px solid transparent; border-right: 12px solid var(--c, var(--accent)); border-left: 0; }
  .msg .lab { position: absolute; left: -200px; right: -200px; bottom: 7px; text-align: center; font-size: 19.5px; color: var(--ink); white-space: nowrap;
              opacity: 0; transition: opacity .5s ease .35s; }
  .msg .lab span { background: var(--bg); padding: 1px 8px; border-radius: 6px; }
  .msg.on .lab { opacity: 1; }
  .msg .lab em { font-style: normal; font-family: var(--mono); font-size: 15px; color: var(--ink-dim); margin-left: 6px; }
  .msg { --c: var(--accent); }
  .msg .ln { background: var(--c); }
  .msg.ok { --c: var(--safe); }
  .msg.bad { --c: var(--danger); }
  .msg.bad .lab { color: #ff8796; }
  .msg.ok .lab { color: #6fe3b2; }
  .msg.dash .ln { background: repeating-linear-gradient(90deg, var(--c) 0 12px, transparent 12px 20px); }
  .msg.warn { --c: var(--warn); }
  .msg.warn .lab { color: #ffd27a; }
  .box { position: absolute; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
         padding: 10px 14px; font-size: 18px; line-height: 1.4; color: var(--ink); text-align: center; }
  .box.ok { border-color: var(--safe-line); background: var(--safe-dim); }
  .box.ok b { color: var(--safe); }
  .box small { display: block; font-size: 15.5px; color: var(--ink-dim); margin-top: 2px; }
  .box.line { padding: 6px 12px; font-size: 16.5px; white-space: nowrap; }
  .box.bad { border-color: var(--danger-line); background: var(--danger-dim); color: #ff8796; }

  /* Token card */
  .tok { position: absolute; top: 196px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px 22px; overflow: hidden; }
  .tok h4 { margin: 0; font-size: 26px; color: var(--ink-hi); display: flex; align-items: center; gap: 12px; }
  .tok h4 .ic { color: var(--warn); width: 26px; height: 26px; }
  .tok .ts { font-family: var(--mono); font-size: 15px; color: var(--ink-faint); margin: 6px 0 16px; }
  .tok .row { display: grid; grid-template-columns: 74px 1fr 26px; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line-soft); }
  .tok .cl { font-family: var(--mono); font-size: 15px; color: var(--accent); }
  .tok .rk { font-size: 15.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; font-family: var(--mono); }
  .tok .rv { font-size: 21px; color: var(--ink-hi); margin-top: 2px; }
  .tok .ck { color: var(--safe); opacity: 0; transition: opacity .4s ease; }
  .tok .ck .ic { width: 22px; height: 22px; }
  .tok.x5 .ck { opacity: 1; }
  .tok .ft { margin-top: 12px; font-size: 18px; color: var(--safe); display: flex; gap: 10px; align-items: center; }
  .stamp { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-12deg) scale(1.5); border: 5px solid var(--danger);
           color: var(--danger); font-family: var(--mono); font-weight: 600; font-size: 46px; letter-spacing: .14em; padding: 6px 22px;
           border-radius: 12px; background: rgba(36, 21, 31, .86); opacity: 0; transition: opacity .5s ease, transform .5s cubic-bezier(.2, 1.4, .4, 1); }
  .stamp.on { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }

  /* ---------- Protocol map ---------- */
  .legend { display: flex; gap: 22px; align-items: center; font-size: 19px; color: var(--ink-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 9px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; background: var(--safe); }
  .dot.a { background: var(--warn); }
  .dot.r { background: var(--danger); }
  .fams { position: absolute; left: 75px; right: 75px; top: 206px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .fam { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px 20px; height: 326px; }
  .fam h3 { margin: 0 0 16px; font-size: 25px; color: var(--ink-hi); display: flex; gap: 12px; align-items: center; }
  .fam h3 .ic { color: #8db4ff; width: 26px; height: 26px; }
  .fam .pl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .fam .pl.one { grid-template-columns: 1fr; }
  .pr { display: flex; gap: 11px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--surface-2); }
  .pr .dot { margin-top: 7px; }
  .pr b { display: block; font-size: 18.5px; font-weight: 500; color: var(--ink-hi); line-height: 1.3; }
  .pr small { display: block; font-size: 15px; color: var(--ink-dim); line-height: 1.3; margin-top: 2px; }
  .pr.r { border-color: var(--danger-line); --glow: rgba(255, 84, 104, .4); }
  .pr.r small { color: #ff8796; }

  /* ---------- Standards ---------- */
  .stds { position: absolute; left: 75px; right: 75px; top: 206px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .std { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px 22px; height: 322px; display: grid; grid-template-columns: 46px 1fr; gap: 0 14px; align-content: start; }
  .std .sk { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-dim); color: #8db4ff; grid-row: span 2; }
  .std .sk .ic { width: 25px; height: 25px; }
  .std h3 { margin: 0; font-size: 24px; color: var(--ink-hi); line-height: 1.22; }
  .std .sub { font-family: var(--mono); font-size: 14.5px; color: var(--ink-faint); margin: 4px 0 0; letter-spacing: .02em; }
  .std p { grid-column: 1 / -1; margin: 16px 0 0; font-size: 19px; line-height: 1.45; color: var(--ink-dim); }
  .std.reg .sk { background: var(--violet-dim); color: var(--violet); }
  .std.ai .sk { background: var(--warn-dim); color: var(--warn); }

  /* ---------- Best practices ---------- */
  .pracs { position: absolute; left: 75px; right: 75px; top: 200px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
  .prac { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; height: 158px;
          display: grid; grid-template-columns: 62px 1fr; gap: 4px 18px; align-items: start; }
  .prac .pn { width: 62px; height: 62px; border-radius: 14px; display: grid; place-items: center; background: var(--safe-dim); color: var(--safe); grid-row: span 3; position: relative; }
  .prac .pn .ic { width: 30px; height: 30px; }
  .prac .pn i { position: absolute; top: -8px; left: -8px; width: 26px; height: 26px; border-radius: 50%; background: var(--safe); color: #05271a;
                font: 600 15px/26px var(--mono); text-align: center; font-style: normal; }
  .prac h3 { margin: 0; font-size: 24.5px; color: var(--ink-hi); }
  .prac p { margin: 2px 0 0; font-size: 18.5px; line-height: 1.4; color: var(--ink-dim); }
  .prac .st { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  .prac .st span { font-family: var(--mono); font-size: 14px; letter-spacing: .03em; padding: 3px 9px; border-radius: 6px; color: #ff8796;
                   background: var(--danger-dim); border: 1px solid rgba(255, 84, 104, .28); }
  .prac .st em { font-style: normal; font-family: var(--mono); font-size: 13.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }

  /* ---------- Fraud and non-compliance ---------- */
  .fc { position: absolute; left: 75px; right: 75px; top: 196px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .col { border-radius: 18px; border: 1px solid var(--line); background: var(--surface); padding: 20px 22px 16px; }
  .col .ch { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .col .ch .ci { width: 50px; height: 50px; border-radius: 13px; display: grid; place-items: center; background: var(--danger-dim); color: var(--danger); flex: none; }
  .col.nc .ch .ci { background: var(--warn-dim); color: var(--warn); }
  .col .ch .ic { width: 27px; height: 27px; }
  .col h3 { margin: 0; font-size: 28px; color: var(--ink-hi); }
  .col .ch small { display: block; font-size: 17.5px; color: var(--ink-dim); margin-top: 2px; }
  .it { display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; padding: 7px 2px; border-top: 1px solid var(--line-soft); align-items: center; }
  .it b { font-size: 20px; font-weight: 500; color: var(--ink-hi); }
  .it small { grid-column: 1; font-size: 16px; color: var(--ink-dim); }
  .it .op { grid-row: span 2; grid-column: 2; font-family: var(--mono); font-size: 13.5px; color: #ffd27a; background: var(--warn-dim);
            border: 1px solid rgba(245, 181, 68, .3); border-radius: 6px; padding: 4px 9px; white-space: nowrap; }
  .col.fr .it b::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); margin-right: 11px; vertical-align: 3px; }

  /* ---------- Attack graph (lateral movement and the layers) ---------- */
  .gl { position: absolute; font-family: var(--mono); font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .nd { position: absolute; width: 186px; height: 106px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
        padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; transition: border-color .5s ease, background .5s ease; }
  .nd .ni { display: flex; gap: 10px; align-items: center; color: var(--ink-dim); }
  .nd .ni .ic { width: 24px; height: 24px; }
  .nd b { font-size: 19px; font-weight: 600; color: var(--ink-hi); line-height: 1.2; }
  .nd .ns { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--danger); opacity: 0; transition: opacity .5s ease; }
  .nd.hit { border-color: var(--danger); background: var(--breach-fill); }
  .nd.hit .ni { color: var(--danger); }
  .nd.hit .ns { opacity: 1; }
  .eg { position: absolute; height: 3px; background: var(--line); border-radius: 2px; }
  .eg::before { content: ""; position: absolute; inset: 0; background: var(--danger); border-radius: 2px; transform: scaleX(0); transform-origin: 0 50%; transition: transform .8s ease var(--d, 0s); }
  .eg::after { content: ""; position: absolute; right: -4px; top: -6px; border: 7.5px solid transparent; border-left: 12px solid var(--line); border-right: 0; transition: border-color .3s ease calc(var(--d, 0s) + .6s); }
  .eg.hit::before { transform: scaleX(1); }
  .eg.hit::after { border-left-color: var(--danger); }
  .el { position: absolute; transform: translateX(-50%); text-align: center; font-size: 17px; line-height: 1.3; color: var(--ink-dim); white-space: nowrap; transition: color .5s ease;
        background: var(--bg); padding: 0 8px 2px; border-radius: 8px; z-index: 1; }
  .el em { display: block; font-style: normal; font-family: var(--mono); font-size: 14px; color: var(--ink-faint); }
  .el.hit { color: #ff8796; }
  .crown { position: absolute; border: 1.5px solid var(--warn-line); background: rgba(245, 181, 68, .06); border-radius: 18px; padding: 22px 22px; }
  .crown h4 { margin: 0 0 14px; font-size: 22px; color: var(--warn); display: flex; gap: 10px; align-items: center; }
  .crown .ic { width: 24px; height: 24px; }
  .crown div { font-size: 20px; color: var(--ink-hi); padding: 9px 0; border-top: 1px solid rgba(245, 181, 68, .18); }
  .crown.hit { border-color: var(--danger); background: var(--danger-dim); }
  .crown.hit h4 { color: var(--danger); }
  .foot { position: absolute; left: 80px; right: 80px; text-align: center; font-size: 24px; color: var(--ink-hi); }
  .cut { position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; display: grid; place-items: center;
         background: #0b2a1f; border: 2px solid var(--safe); color: var(--safe); font: 600 20px/1 var(--mono); box-shadow: 0 0 22px rgba(38, 209, 138, .35);
         opacity: 0; transform: scale(.4); transition: opacity .45s ease, transform .55s cubic-bezier(.2, 1.5, .4, 1); }
  .cut.on { opacity: 1; transform: scale(1); }
  .lyr { position: absolute; left: 75px; right: 75px; top: 196px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .ly { border: 1px solid var(--line); background: var(--surface); border-radius: 15px; padding: 14px 18px; display: grid; grid-template-columns: 46px 1fr; gap: 2px 14px; height: 124px; }
  .ly .lc { grid-row: span 2; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #0b2a1f; border: 2px solid var(--safe);
            color: var(--safe); font: 600 20px/1 var(--mono); }
  .ly h4 { margin: 0; font-size: 21px; color: var(--ink-hi); }
  .ly p { margin: 0; font-size: 16.5px; color: var(--ink-dim); line-height: 1.35; }

  /* ---------- ISPM ---------- */
  .ispm { position: absolute; left: 70px; right: 70px; top: 238px; display: grid; grid-template-columns: 420px 1fr 468px; gap: 28px; }
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; }
  .pane h3 { margin: 0 0 14px; font-family: var(--mono); font-size: 16px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500;
             display: flex; gap: 10px; align-items: center; }
  .pane h3 .ic { width: 20px; height: 20px; color: #8db4ff; }
  .ctr { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .ctr .ci { width: 52px; height: 52px; border-radius: 13px; display: grid; place-items: center; background: var(--accent-dim); color: #8db4ff; flex: none; }
  .ctr .ci .ic { width: 28px; height: 28px; }
  .ctr.m .ci { background: var(--violet-dim); color: var(--violet); }
  .ctr.a .ci { background: var(--warn-dim); color: var(--warn); }
  .ctr .cv { font-size: 40px; font-weight: 600; color: var(--ink-hi); font-variant-numeric: tabular-nums; line-height: 1.05; }
  .ctr .cn { font-size: 18px; color: var(--ink-dim); }

        { s: 4, t: '09:09:20', sig: 'L’agent de soutien demande une exportation massive de données clients', det: 'Pouvoir d’action excessif', id: 'OWASP LLM06', res: 'Bloqué, agent en quarantaine, propriétaire prévenu' },
        { s: 4, t: '09:10:05', sig: 'L’opérateur mobile signale un échange de SIM sur la ligne d’un client', det: 'Risque de prise de contrôle', id: 'T1451 · signal partagé', res: 'Virements retenus, approbation sur l’appareil du client' },
      ],

    layers: { ey: 'Chapitre 11 · Défense en profondeur', ti: 'Quatre couches coupent les chemins d’attaque',
      layers: [
        ['Authentification forte', 'Clés d’accès et jetons liés rendent une session volée inutile.'],

        ['Contrôles d’exécution des agents', 'Vérifient chaque action d’agent par rapport à son mandat.'],
      ] },
  },
};

// French typography: non-breaking spaces before : ; ? ! and inside numbers and amounts.
(function frenchSpaces(o) {
  for (const k of Object.keys(o)) {
    if (typeof o[k] === 'string') {
      o[k] = o[k].replace(/ ([:;?!])/g, '\u00a0$1').replace(/(\d) (\d{3})/g, '$1\u00a0$2').replace(/(\d) ([$%])/g, '$1\u00a0$2');
    } else if (o[k] && typeof o[k] === 'object') frenchSpaces(o[k]);
  }
})(T.fr);

/* ------------------------------------------------------------------ scenes */
const ORDER = ['title', 'ids', 'human', 'agent', 'protocols', 'standards', 'practices', 'fraud', 'lateral', 'ispm', 'itdr', 'layers'];
const STEPS = { title: 0, ids: 3, human: 6, agent: 6, protocols: 6, standards: 5, practices: 4, fraud: 3, lateral: 3, ispm: 4, itdr: 5, layers: 4 };
let LANG = /(^|[#&])fr\b/.test(location.hash) ? 'fr' : 'en';
const nf = (n) => n.toLocaleString(LANG === 'fr' ? 'fr-CA' : 'en-US').replace(/ /g, ' ');

const header = (d, right = '') => `<div class="hd"><div><p class="ey">${d.ey}</p><h2 class="ti">${d.ti}</h2></div>${right}</div>`;
const chips = (list) => `<div class="chips">${list.map((c) => `<span class="chip">${c}</span>`).join('')}</div>`;

function sceneTitle(d) {
  return `<div style="position:absolute;left:160px;right:160px;top:330px">
    <p class="ey" style="font-size:20px">${d.ey}</p>
    <h1 style="font-size:84px;line-height:1.08;margin:18px 0 30px;color:var(--ink-hi);letter-spacing:-.015em">${d.ti}</h1>
    <p style="font-size:28px;line-height:1.55;color:var(--ink-dim);max-width:1350px;margin:0">${d.sub}</p></div>`;
}

function sceneIds(d) {
  return header(d) + `<div class="ids">${d.cols.map((c, i) => `
    <div class="idc ${c.cls}" data-s="${i + 1}"><div class="big">${ic(c.icon)}</div><h3>${c.name}</h3><p>${c.text}</p>
      <div class="how">${d.how}</div><ul>${c.how.map((h) => `<li>${h}</li>`).join('')}</ul></div>`).join('')}</div>`;
}

// A sequence diagram: lanes with lifelines, messages that draw themselves step by step.
function seqDiagram(d, { left, width, tight = false }) {
  const lw = width / d.lanes.length;
  const X = Object.fromEntries(d.lanes.map((l, i) => [l.id, lw * i + lw / 2]));
  let h = `<div class="seq ${tight ? 'tight' : ''}" style="left:${left}px;width:${width}px">`;
  d.lanes.forEach((l) => {
    h += `<div class="life" style="left:${X[l.id]}px"></div>`;
    h += `<div class="lane ${l.cls || ''}" style="left:${X[l.id]}px;width:${lw - 18}px"><span class="li">${ic(l.icon)}</span><span><b>${l.name}</b><small>${l.sub}</small></span></div>`;
  });
  d.msgs.forEach((m) => {
    const a = X[m.from], b = X[m.to];
    const dir = b > a ? 'ltr' : 'rtl';
    h += `<div class="msg ${dir} ${m.kind || ''} ${m.both ? 'both' : ''}" data-s="${m.s}" style="left:${Math.min(a, b)}px;width:${Math.abs(b - a)}px;top:${m.y - 34}px">
      <div class="lab"><span>${m.label}${m.em ? `<em>${m.em}</em>` : ''}</span></div><div class="ln"></div></div>`;
  });
  (d.boxes || []).forEach((bx) => {
    h += `<div class="box ${bx.cls || ''}" data-s="${bx.s}" style="left:${X[bx.lane] + (bx.dx || 0) - bx.w / 2}px;top:${bx.y}px;width:${bx.w}px">${bx.html}</div>`;
  });
  if (d.hop) {
    const a = X.agent, b = X.api;
    h += `<div class="msg ltr bad" data-s="${d.hop.s}" style="left:${a}px;width:${b - a}px;top:${692 - 34}px">
      <div class="lab"><span>${d.hop.label}<em>${d.hop.em}</em></span></div><div class="ln"></div></div>`;
  }
  return h + '</div>';
}

function tokenCard(t, { left, width, revealAt, revokeAt }) {
  return `<div class="tok" data-s="${revealAt}" data-x="5" style="left:${left}px;width:${width}px">
    <h4>${ic('key')}${t.title}</h4><div class="ts">${t.sub}</div>
    ${t.rows.map(([c, k, v]) => `<div class="row"><span class="cl">${c}</span><span><div class="rk">${k}</div><div class="rv">${v}</div></span><span class="ck">${ic('check')}</span></div>`).join('')}
    <div class="ft" data-s="5">${ic('check')}${t.foot}</div>
    ${revokeAt ? `<div class="stamp" data-s="${revokeAt}">${t.stamp}</div>` : ''}</div>`;
}

function sceneHuman(d) {
  return header(d, chips(d.chips)) + seqDiagram(d, { left: 80, width: 1180 }) + tokenCard(d.tok, { left: 1306, width: 534, revealAt: 4, revokeAt: 6 });
}
function sceneAgent(d) {
  return header(d, chips(d.chips)) + seqDiagram(d, { left: 70, width: 1270, tight: true }) + tokenCard(d.tok, { left: 1372, width: 478, revealAt: 3 });
}

function sceneProtocols(d) {
  const legend = `<div class="legend">${['', 'a', 'r'].map((k, i) => `<span><i class="dot ${k}"></i>${d.legend[i]}</span>`).join('')}</div>`;
  return header(d, legend) + `<div class="fams">${d.fams.map((f) => `
    <div class="fam" data-s="${f.s}"><h3>${ic(f.icon)}${f.name}</h3><div class="pl ${f.one ? 'one' : ''}">
      ${f.items.map(([k, n, s]) => `<div class="pr ${k === 'r' ? 'r' : ''}" ${k === 'r' ? 'data-hl="6"' : ''}><i class="dot ${k === 'g' ? '' : k}"></i><span><b>${n}</b><small>${s}</small></span></div>`).join('')}
    </div></div>`).join('')}</div>`;
}

function sceneStandards(d) {
  return header(d) + `<div class="stds">${d.items.map((it) => `
    <div class="std ${it.cls || ''}" data-s="${it.s}"><div class="sk">${ic(it.icon)}</div><h3>${it.name}</h3><div class="sub">${it.sub}</div><p>${it.text}</p></div>`).join('')}</div>
    <div class="note">${d.note}</div>`;
}

function scenePractices(d) {
  return header(d) + `<div class="pracs">${d.items.map((it, i) => `
    <div class="prac" data-s="${it.s}"><div class="pn">${ic(it.icon)}<i>${i + 1}</i></div><h3>${it.name}</h3><p>${it.text}</p>
      <div class="st"><em>${d.stops}</em>${it.stops.map((s) => `<span>${s}</span>`).join('')}</div></div>`).join('')}</div>`;
}

function sceneFraud(d) {
  return header(d) + `<div class="fc">
    <div class="col fr" data-s="1"><div class="ch"><span class="ci">${ic('alert')}</span><span><h3>${d.fraud.name}</h3><small>${d.fraud.sub}</small></span></div>
      ${d.fraud.items.map(([n, s]) => `<div class="it" data-s="2"><b>${n}</b><small>${s}</small></div>`).join('')}</div>
    <div class="col nc" data-s="1"><div class="ch"><span class="ci">${ic('lock')}</span><span><h3>${d.nc.name}</h3><small>${d.nc.sub}</small></span></div>
      ${d.nc.items.map(([n, s, o]) => `<div class="it" data-s="3"><b>${n}</b><small>${s}</small><span class="op">${o}</span></div>`).join('')}</div>
  </div>`;
}

// The attack graph, shared by the lateral movement and defense-in-depth scenes.
function attackGraph(d, { yA, yB, hitA, hitB, cuts }) {
  const L = 80, CROWN_X = 1636, NW = 186;
  let h = `<div class="gl" style="left:${L}px;top:${yA - 40}px">${d.rowA}</div><div class="gl" style="left:${L}px;top:${yB - 40}px">${d.rowB}</div>`;
  const row = (nodes, edges, y, key, hitStep) => {
    const n = nodes.length;
    const gap = (CROWN_X - L - n * NW) / n; // the last edge runs into the crown jewels
    let r = '';
    nodes.forEach(([icon, name], i) => {
      const x = L + i * (NW + gap);
      const delay = (i * 0.9).toFixed(1);
      r += `<div class="nd" ${hitStep ? `data-x="${hitStep}" data-xc="hit"` : ''} style="left:${x}px;top:${y}px;transition-delay:${delay}s">
        <span class="ni">${ic(icon)}</span><b>${name}</b><span class="ns" style="transition-delay:${delay}s">${d.state}</span></div>`;
      const ex = x + NW, ew = gap;
      const ed = (i * 0.9 + 0.45).toFixed(1);
      const [label, id] = edges[i];
      r += `<div class="eg" ${hitStep ? `data-x="${hitStep}" data-xc="hit"` : ''} style="left:${ex + 10}px;top:${y + 52}px;width:${ew - 22}px" data-delay="${ed}"></div>`;
      r += `<div class="el" ${hitStep ? `data-x="${hitStep}" data-xc="hit"` : ''} style="left:${ex + ew / 2}px;top:${y + 118}px;transition-delay:${ed}s">${label}<em>${id}</em></div>`;
      if (cuts && cuts[`${key}${i}`]) {
        r += `<div class="cut" data-s="${cuts[`${key}${i}`]}" style="left:${ex + ew / 2}px;top:${y + 53}px">${cuts[`${key}${i}`]}</div>`;
      }
    });
    return r;
  };
  const crownTop = yA - 10, crownH = yB + 106 - crownTop + 20;
  h += `<div class="crown" ${hitA ? `data-x="${hitA}" data-xc="hit"` : ''} style="left:${CROWN_X}px;top:${crownTop}px;width:214px;height:${crownH}px;transition-delay:4.1s">
    <h4>${ic('crown')}${d.crown}</h4>${d.jewels.map((j) => `<div>${j}</div>`).join('')}</div>`;
  h += row(d.nodesA, d.edgesA, yA, 'a', hitA);
  h += row(d.nodesB, d.edgesB, yB, 'b', hitB);
  return h;
}

function sceneLateral(d) {
  return header(d) + attackGraph(d, { yA: 262, yB: 560, hitA: 2, hitB: 3 })
    + `<div class="foot" data-s="3" style="top:836px">${d.foot}</div>`;
}

function sceneLayers(d) {
  const g = T[LANG].lateral;
  const cuts = { a0: 1, a2: 2, a3: 2, b1: 2, a1: 3, b2: 4, b3: 4 };
  return header(d) + `<div class="lyr">${d.layers.map(([n, s], i) => `
    <div class="ly" data-s="${i + 1}"><span class="lc">${i + 1}</span><h4>${n}</h4><p>${s}</p></div>`).join('')}</div>`
    + attackGraph(g, { yA: 400, yB: 640, hitA: 0, hitB: 0, cuts }).replace(/class="(eg|el)"/g, 'class="$1 hit"');
}

function sceneIspm(d) {
  return header(d) + `<div class="ispm">
    <div class="pane" data-s="1"><h3>${ic('search')}${d.discover}</h3>
      ${d.ctrs.map(([icon, n, label], i) => `<div class="ctr ${['', 'm', 'a'][i]}"><span class="ci">${ic(icon)}</span><span><div class="cv" data-count="${n}">0</div><div class="cn">${label}</div></span></div>`).join('')}
      <div class="src">${d.sources}</div></div>
    <div class="pane" data-s="2"><h3>${ic('alert')}${d.find}</h3>
      ${d.finds.map(([v, n, o]) => `<div class="fd" data-x="3" data-x2="4"><span class="fv">${v}</span><b>${n}</b><span class="op">${d.opens} · ${o}</span></div>`).join('')}</div>
    <div class="pane" data-s="3"><h3>${ic('shieldCheck')}${d.fix}</h3>
      <div class="score"><span class="sv" data-x="4" data-xc="good">58</span><span class="so">/ 100 · ${d.score}</span></div>
      <div class="bar"><i data-x="4" data-xc="good"></i></div><div class="sl">${d.scoreSub}</div>
      ${d.fixes.map((f) => `<div class="fix">${ic('check')}<span>${f}</span></div>`).join('')}</div>
  </div><div class="note">${d.note}</div>`;
}

function sceneItdr(d) {
  return header(d) + `<div class="tl" data-x="5">
    <div class="tr th" data-s="1">${d.head.map((x) => `<span>${x}</span>`).join('')}</div>
    ${d.rows.map((r) => `<div class="tr ev" data-s="${r.s}"><span class="tm">${r.t}</span><span class="sg">${r.sig}</span>
      <span class="dt">${r.det}<em>${r.id}</em></span><span class="rs">${ic('shieldCheck')}<span>${r.res}<span class="inc">${d.inc}</span></span></span></div>`).join('')}
    <div class="kpis" data-s="5">${d.kpis.map(([icon, k]) => `<div class="kpi">${ic(icon)}${k}</div>`).join('')}</div>
  </div><div class="note">${d.note}</div>`;
}

const BUILD = { title: sceneTitle, ids: sceneIds, human: sceneHuman, agent: sceneAgent, protocols: sceneProtocols, standards: sceneStandards,
  practices: scenePractices, fraud: sceneFraud, lateral: sceneLateral, ispm: sceneIspm, itdr: sceneItdr, layers: sceneLayers };

/* ------------------------------------------------------------------ state */
const wrap = document.getElementById('wrap');
let cur = { scene: 'title', step: 0 };

function build() {
  document.documentElement.lang = LANG;
  wrap.innerHTML = ORDER.map((id) => `<section class="scene" id="sc-${id}">${BUILD[id](T[LANG][id])}</section>`).join('');
  document.querySelectorAll('.nav [data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  document.getElementById('prev').textContent = '‹ ' + T[LANG].nav.back;
  document.getElementById('next').textContent = T[LANG].nav.next + ' ›';
}

function countUp(el) {
  if (el.dataset.done) return;
  el.dataset.done = '1';
  const to = Number(el.dataset.count), t0 = performance.now(), ms = 1600;
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = nf(Math.round(to * e));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function countTo(el, from, to, ms) {
  const t0 = performance.now();
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = String(Math.round(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function apply(sceneEl, n) {
  sceneEl.querySelectorAll('[data-s]').forEach((el) => el.classList.toggle('on', Number(el.dataset.s) <= n));
  sceneEl.querySelectorAll('[data-hl]').forEach((el) => el.classList.toggle('hl', el.dataset.hl.split(',').map(Number).includes(n)));
  sceneEl.querySelectorAll('[data-x]').forEach((el) => {
    const on = Number(el.dataset.x) > 0 && Number(el.dataset.x) <= n;
    el.classList.toggle(el.dataset.xc || 'x' + el.dataset.x, on);
    if (el.classList.contains('eg')) el.style.setProperty('--d', on ? (el.dataset.delay || 0) + 's' : '0s');
  });
  sceneEl.querySelectorAll('[data-x2]').forEach((el) => el.classList.toggle('x' + el.dataset.x2, Number(el.dataset.x2) <= n));
  sceneEl.querySelectorAll('[data-count]').forEach((el) => {
    const shown = el.closest('[data-s]');
    if (!shown || shown.classList.contains('on')) countUp(el);
  });
  const sv = sceneEl.querySelector('.score .sv');
  if (sv) {
    const good = sv.classList.contains('good');
    if (good && sv.dataset.at !== '86') { sv.dataset.at = '86'; countTo(sv, 58, 86, 1600); }
    if (!good && sv.dataset.at === '86') { sv.dataset.at = '58'; sv.textContent = '58'; }
  }
}

function go(scene, step = 0, instant = false) {
  const el = document.getElementById('sc-' + scene);
  if (instant) wrap.classList.add('instant');
  wrap.querySelectorAll('.scene').forEach((s) => s.classList.toggle('active', s === el));
  apply(el, step);
  cur = { scene, step };
  if (instant) { void wrap.offsetWidth; wrap.classList.remove('instant'); }
  updateNav();
}
function step(n) { cur.step = n; apply(document.getElementById('sc-' + cur.scene), n); updateNav(); }
function next() {
  if (cur.step < STEPS[cur.scene]) return step(cur.step + 1);
  const i = ORDER.indexOf(cur.scene);
  if (i < ORDER.length - 1) go(ORDER[i + 1], 0);
}
function prev() {
  if (cur.step > 0) return step(cur.step - 1);
  const i = ORDER.indexOf(cur.scene);
  if (i > 0) go(ORDER[i - 1], STEPS[ORDER[i - 1]]);
}
function updateNav() {
  const i = ORDER.indexOf(cur.scene);
  document.getElementById('pos').textContent = `${i + 1} ${T[LANG].nav.of} ${ORDER.length} · ${cur.step}/${STEPS[cur.scene]}`;
}
function setLang(l) {
  LANG = l;
  history.replaceState(null, '', l === 'fr' ? '#fr' : '#');
  const keep = { ...cur };
  build();
  go(keep.scene, keep.step, true);
}

// Fits the 1920x1080 canvas into the window.
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  const f = document.getElementById('fit');
  f.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}

build();
go('title', 0, true);
fit();
addEventListener('resize', fit);
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
document.querySelectorAll('.nav [data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
});

// The film's handle on the page.
window.explain = {
  film() { document.body.classList.add('film'); },
  go, step,
};
</script>
